name: dreamflow
description: "DreamFlow 梦洄 · 水墨 × 莫兰迪 设计体系 Flutter 实现"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# 仅依赖 Flutter SDK 自带包，保证离线可 pub get / analyze / test
dependencies:
  audio_service: ^0.18.18
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_local_notifications: ^19.0.0
  go_router: ^18.1.1
  http: ^1.2.0
  just_audio: ^0.10.0
  just_audio_windows: ^0.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.2.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/fonts/

  # §4.3 字体（OFL，已子集化：tool/font_subset.py）
  fonts:
    - family: MaShanZheng
      fonts:
        - asset: assets/fonts/MaShanZheng-Regular.ttf
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
          weight: 600

# sqlite3 native assets hook: 国内无法直连 GitHub，改用本地预下载的 SQLite
# .so 文件位于 tool/sqlite3_native/（来自 simolus3/sqlite3.dart release sqlite3-3.5.2）
hooks:
  user_defines:
    sqlite3:
      source: test-sqlite3
      directory: tool/sqlite3_native/
